name: R1 qualification

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python-engine:
    name: Python engine and regression suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run full Python suite
        run: python -m pytest

  application-api:
    name: Application and API contracts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run application/API tests
        run: python -m pytest tests/application tests/api

      - name: Verify checked-in OpenAPI snapshot
        run: python scripts/check_openapi_contract.py

  frontend:
    name: Frontend typecheck, unit tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile --ignore-scripts

      - name: Regenerate TypeScript API types
        run: pnpm --dir frontend run generate:api

      - name: Check generated API types are committed
        run: git diff --exit-code -- frontend/src/api/openapi.d.ts

      - name: Typecheck frontend
        run: pnpm --dir frontend run typecheck

      - name: Run frontend unit and component tests
        run: pnpm --dir frontend run test

      - name: Build production SPA
        run: pnpm --dir frontend run build

  browser:
    name: Release-like browser shell journey
    runs-on: ubuntu-latest
    needs:
      - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python application
        run: python -m pip install -e ".[dev]"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile --ignore-scripts

      - name: Build production SPA for release-like serving
        run: pnpm --dir frontend run build

      - name: Install Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Run browser shell journey
        run: pnpm --dir frontend run test:e2e
