[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hcm-calculator"
version = "0.9.0"
description = "Auditable Highway Capacity Manual calculator scaffold"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "bokoboss" }
]
dependencies = [
  # FastAPI and Pydantic generate the committed OpenAPI contract. Keep both
  # exact so clean installs cannot silently change the API schema.
  "fastapi==0.141.1",
  "openpyxl>=3.1",
  "pydantic==2.13.4",
  "PyYAML>=6.0",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.12,<3",
  "pytest>=8.2"
]
ui = [
  "streamlit>=1.59"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/hcmcalc"]
